name: Build & Release Whisper GUI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install FFmpeg & Qt Linux libraries (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libgl1 libegl1 libxkbcommon-x11-0

      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg

      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install ffmpeg --no-progress
          echo "C:\ProgramData\chocolatey\bin" >> $env:GITHUB_PATH

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-qt

      - name: Run Pytest
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pytest -v

  build-linux:
    name: Build Linux Binary
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install FFmpeg & Qt Linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libgl1 libegl1 libxkbcommon-x11-0

      - name: Install Dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Build Standalone Bundle
        run: |
          python scripts/bundle_app.py

      - name: Archive Linux Package
        run: |
          cd dist
          tar -czf WhisperGUI-linux-x86_64.tar.gz WhisperGUI/

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v7
        with:
          name: WhisperGUI-linux-x86_64
          path: dist/WhisperGUI-linux-x86_64.tar.gz

  build-macos:
    name: Build macOS Application
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install FFmpeg
        run: |
          brew install ffmpeg

      - name: Install Dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Build Standalone Bundle (.app)
        run: |
          python scripts/bundle_app.py

      - name: Archive macOS Package
        run: |
          cd dist
          zip -r WhisperGUI-macos.zip WhisperGUI.app

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v7
        with:
          name: WhisperGUI-macos
          path: dist/WhisperGUI-macos.zip

  build-windows:
    name: Build Windows Executable
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install FFmpeg (Windows)
        run: |
          choco install ffmpeg --no-progress
          echo "C:\ProgramData\chocolatey\bin" >> $env:GITHUB_PATH

      - name: Install Dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Copy FFmpeg binaries into bundle staging
        shell: bash
        run: |
          mkdir -p bin
          cp /c/ProgramData/chocolatey/lib/ffmpeg/tools/ffmpeg/bin/ffmpeg.exe bin/ || cp /c/ProgramData/chocolatey/bin/ffmpeg.exe bin/ || true
          cp /c/ProgramData/chocolatey/lib/ffmpeg/tools/ffmpeg/bin/ffprobe.exe bin/ || cp /c/ProgramData/chocolatey/bin/ffprobe.exe bin/ || true

      - name: Build Standalone Bundle
        run: |
          python scripts/bundle_app.py

      - name: Archive Windows Package
        shell: bash
        run: |
          cd dist
          7z a -tzip WhisperGUI-windows-x64.zip WhisperGUI/

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v7
        with:
          name: WhisperGUI-windows-x64
          path: dist/WhisperGUI-windows-x64.zip

  publish-release:
    name: Publish GitHub Release
    needs: [build-linux, build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Download Linux Artifact
        uses: actions/download-artifact@v8
        with:
          name: WhisperGUI-linux-x86_64
          path: release-assets/

      - name: Download macOS Artifact
        uses: actions/download-artifact@v8
        with:
          name: WhisperGUI-macos
          path: release-assets/

      - name: Download Windows Artifact
        uses: actions/download-artifact@v8
        with:
          name: WhisperGUI-windows-x64
          path: release-assets/

      - name: Determine Release Tag
        id: tag_info
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "tag=latest-build" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release & Upload Binaries
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag_info.outputs.tag }}
          name: Whisper GUI ${{ steps.tag_info.outputs.tag }}
          draft: false
          prerelease: false
          files: |
            release-assets/WhisperGUI-linux-x86_64.tar.gz
            release-assets/WhisperGUI-macos.zip
            release-assets/WhisperGUI-windows-x64.zip
          body: |
            ## Whisper GUI Desktop Application

            ### 📦 Downloads by Operating System

            | Operating System | Download File | How to Run |
            |---|---|---|
            | 🍏 **macOS (Apple Silicon & Intel)** | [`WhisperGUI-macos.zip`](https://github.com/${{ github.repository }}/releases/download/${{ steps.tag_info.outputs.tag }}/WhisperGUI-macos.zip) | Unzip to get `WhisperGUI.app`, double-click or drag into `/Applications` |
            | 🪟 **Windows (x64)** | [`WhisperGUI-windows-x64.zip`](https://github.com/${{ github.repository }}/releases/download/${{ steps.tag_info.outputs.tag }}/WhisperGUI-windows-x64.zip) | Extract and run `WhisperGUI\WhisperGUI.exe` |
            | 🐧 **Linux (x86_64)** | [`WhisperGUI-linux-x86_64.tar.gz`](https://github.com/${{ github.repository }}/releases/download/${{ steps.tag_info.outputs.tag }}/WhisperGUI-linux-x86_64.tar.gz) | Extract and run `./WhisperGUI/WhisperGUI` |

            ---

            ### ✨ Highlights
            - **Local-First Audio Transcription**: High-accuracy offline transcription via faster-whisper (`large-v3-turbo` by default).
            - **Click-to-Import Dropzone**: Clean drag-and-drop dropzone with one-click file picker integration.
            - **Multi-Format Document Export**: Formatted export to Word (.docx), publication-quality PDF (.pdf), Markdown (.md), and Plain Text (.txt).
            - **Lateral Tracks Drawer**: Slide-out multi-track queue with live status pills and one-click track activation.
            - **Audio Length Trimming**: Frame-accurate FFmpeg range extraction without modifying original files.
            - **Optional Speech Polishing**: Disfluency removal and grammar polishing via AI models.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
