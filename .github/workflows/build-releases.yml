name: Build & Release Whisper GUI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install FFmpeg & Qt Linux libraries (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libgl1 libegl1 libxkbcommon-x11-0

      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg

      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install ffmpeg --no-progress
          echo "C:\ProgramData\chocolatey\bin" >> $env:GITHUB_PATH

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-qt

      - name: Run Pytest
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pytest -v

  build-linux:
    name: Build Linux Binary
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install FFmpeg & Qt Linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libgl1 libegl1 libxkbcommon-x11-0

      - name: Sync Version to Release Tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          python - <<'PY'
          import os, pathlib, re
          v = os.environ["GITHUB_REF_NAME"].lstrip("v")
          p = pathlib.Path("src/whisper_gui/__init__.py")
          p.write_text(re.sub(r'__version__\s*=\s*["\'].*?["\']', f'__version__ = "{v}"', p.read_text()))
          PY

      - name: Install Dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Build Standalone Bundle
        run: |
          python scripts/bundle_app.py

      - name: Archive Linux Package
        run: |
          cd dist
          tar -czf WhisperGUI-linux-x86_64.tar.gz WhisperGUI/

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v7
        with:
          name: WhisperGUI-linux-x86_64
          path: dist/WhisperGUI-linux-x86_64.tar.gz

  build-macos:
    name: Build macOS Application
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install FFmpeg
        run: |
          brew install ffmpeg

      - name: Sync Version to Release Tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          python - <<'PY'
          import os, pathlib, re
          v = os.environ["GITHUB_REF_NAME"].lstrip("v")
          p = pathlib.Path("src/whisper_gui/__init__.py")
          p.write_text(re.sub(r'__version__\s*=\s*["\'].*?["\']', f'__version__ = "{v}"', p.read_text()))
          PY

      - name: Install Dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Build Standalone Bundle (.app)
        run: |
          python scripts/bundle_app.py

      - name: Ad-hoc Sign & Archive macOS Package
        run: |
          cd dist
          codesign --force --deep --sign - WhisperGUI.app
          ditto -c -k --keepParent WhisperGUI.app WhisperGUI-macos.zip

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v7
        with:
          name: WhisperGUI-macos
          path: dist/WhisperGUI-macos.zip

  build-windows:
    name: Build Windows Executable
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install FFmpeg (Windows)
        run: |
          choco install ffmpeg --no-progress
          echo "C:\ProgramData\chocolatey\bin" >> $env:GITHUB_PATH

      - name: Sync Version to Release Tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          python - <<'PY'
          import os, pathlib, re
          v = os.environ["GITHUB_REF_NAME"].lstrip("v")
          p = pathlib.Path("src/whisper_gui/__init__.py")
          p.write_text(re.sub(r'__version__\s*=\s*["\'].*?["\']', f'__version__ = "{v}"', p.read_text()))
          PY

      - name: Install Dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Copy FFmpeg binaries into bundle staging
        shell: bash
        run: |
          mkdir -p bin
          cp /c/ProgramData/chocolatey/lib/ffmpeg/tools/ffmpeg/bin/ffmpeg.exe bin/ || cp /c/ProgramData/chocolatey/bin/ffmpeg.exe bin/ || true
          cp /c/ProgramData/chocolatey/lib/ffmpeg/tools/ffmpeg/bin/ffprobe.exe bin/ || cp /c/ProgramData/chocolatey/bin/ffprobe.exe bin/ || true

      - name: Build Standalone Bundle
        run: |
          python scripts/bundle_app.py

      - name: Archive Windows Package
        shell: bash
        run: |
          cd dist
          7z a -tzip WhisperGUI-windows-x64.zip WhisperGUI/

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v7
        with:
          name: WhisperGUI-windows-x64
          path: dist/WhisperGUI-windows-x64.zip

  publish-release:
    name: Publish GitHub Release
    needs: [build-linux, build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download Linux Artifact
        uses: actions/download-artifact@v8
        with:
          name: WhisperGUI-linux-x86_64
          path: release-assets/

      - name: Download macOS Artifact
        uses: actions/download-artifact@v8
        with:
          name: WhisperGUI-macos
          path: release-assets/

      - name: Download Windows Artifact
        uses: actions/download-artifact@v8
        with:
          name: WhisperGUI-windows-x64
          path: release-assets/

      - name: Determine Release Tag
        id: tag_info
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "tag=latest-build" >> $GITHUB_OUTPUT
          fi

      - name: Build Release Notes
        id: notes
        shell: bash
        run: |
          TAG="${{ steps.tag_info.outputs.tag }}"
          REPO="${{ github.repository }}"
          python - <<'PY'
          import os, pathlib, re

          tag = os.environ["TAG"]
          repo = os.environ["REPO"]
          changelog_path = pathlib.Path("CHANGELOG.md")
          section = ""
          if changelog_path.is_file():
              text = changelog_path.read_text(encoding="utf-8")
              pattern = rf"(?ms)^##\s+{re.escape(tag)}\s*\n(.*?)(?=^##\s+|\Z)"
              m = re.search(pattern, text)
              if m:
                  section = m.group(1).strip()

          if not section:
              section = "### What's New\n- Maintenance and stability improvements."

          downloads = (
              "---\n\n"
              "### Downloads by Operating System\n\n"
              "| Operating System | Download File | How to Run |\n"
              "|---|---|---|\n"
              f"| **macOS (Apple Silicon & Intel)** | [`WhisperGUI-macos.zip`](https://github.com/{repo}/releases/download/{tag}/WhisperGUI-macos.zip) | Unzip to get `WhisperGUI.app`, double-click or drag into `/Applications` |\n"
              f"| **Windows (x64)** | [`WhisperGUI-windows-x64.zip`](https://github.com/{repo}/releases/download/{tag}/WhisperGUI-windows-x64.zip) | Extract and run `WhisperGUI\\WhisperGUI.exe` |\n"
              f"| **Linux (x86_64)** | [`WhisperGUI-linux-x86_64.tar.gz`](https://github.com/{repo}/releases/download/{tag}/WhisperGUI-linux-x86_64.tar.gz) | Extract and run `./WhisperGUI/WhisperGUI` |\n"
          )

          pathlib.Path("release-body.md").write_text(f"{section}\n\n{downloads}", encoding="utf-8")
          PY
        env:
          TAG: ${{ steps.tag_info.outputs.tag }}
          REPO: ${{ github.repository }}

      - name: Create GitHub Release & Upload Binaries
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag_info.outputs.tag }}
          name: Whisper GUI ${{ steps.tag_info.outputs.tag }}
          draft: false
          prerelease: false
          files: |
            release-assets/WhisperGUI-linux-x86_64.tar.gz
            release-assets/WhisperGUI-macos.zip
            release-assets/WhisperGUI-windows-x64.zip
          body_path: release-body.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
