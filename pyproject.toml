[project]
name = "whisper-gui"
version = "0.1.0"
description = "Desktop Qt application to transcribe audio files with faster-whisper and export to Word (.docx) documents, with ffmpeg length trimming."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "faster-whisper>=1.0.0",
    "av>=18.0.0,<19.0.0",
    "PySide6>=6.5.0",
    "python-docx>=1.0.0",
    "numpy>=1.24.0",
    "certifi>=2024.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-qt>=4.4.0",
]

[project.scripts]
whisper-gui = "whisper_gui.main:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
